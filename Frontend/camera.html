<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aperture</title>
<style>
  :root{
    --body-bg: #17181a;
    --panel: #1f2023;
    --panel-2: #26282b;
    --line: #34363a;
    --text: #eceae4;
    --text-dim: #8a8d92;
    --accent: #e8a33d;
    --accent-dim: #6b5227;
    --danger: #d9614f;
    --mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; height:100%;
    background:var(--body-bg);
    color:var(--text);
    font-family:var(--sans);
    -webkit-tap-highlight-color: transparent;
  }
  body{
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }

  .rig{
    width:100%;
    max-width:520px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:14px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6);
  }

  .top-strip{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:2px 6px;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.08em;
    color:var(--text-dim);
    text-transform:uppercase;
  }
  .top-strip .brand{
    color:var(--text);
    font-weight:600;
    letter-spacing:0.14em;
  }
  .top-strip .brand::before{
    content:"● ";
    color:var(--accent);
  }
  .rec-dot{
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .rec-dot span.d{
    width:7px; height:7px; border-radius:50%;
    background:var(--danger);
    box-shadow:0 0 0 0 rgba(217,97,79,0.6);
    animation:pulse 1.8s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(217,97,79,0.5);}
    70%{box-shadow:0 0 0 8px rgba(217,97,79,0);}
    100%{box-shadow:0 0 0 0 rgba(217,97,79,0);}
  }

  .folder-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    flex-wrap:wrap;
    padding:0 2px;
  }
  .folder-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.03em;
    padding:7px 10px;
    border-radius:8px;
    cursor:pointer;
  }
  .folder-btn svg{ width:14px; height:14px; flex:0 0 auto; }
  .folder-btn:hover{ background:#2c2e32; }
  .folder-btn.linked{
    color:var(--accent);
    border-color:var(--accent-dim);
  }
  .autosave-toggle{
    display:flex;
    align-items:center;
    gap:6px;
    font-family:var(--mono);
    font-size:11px;
    color:var(--text-dim);
    cursor:pointer;
    user-select:none;
  }
  .autosave-toggle input{
    accent-color: var(--accent);
    width:13px; height:13px;
  }

  .viewfinder{
    position:relative;
    aspect-ratio: 4/3;
    background:#000;
    border-radius:12px;
    overflow:hidden;
    border:1px solid var(--line);
  }
  .viewfinder video{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    transform: scaleX(-1);
  }
  .viewfinder.rear video{ transform:none; }

  .frame-corners span{
    position:absolute;
    width:18px; height:18px;
    border:2px solid rgba(232,163,61,0.85);
  }
  .fc-tl{ top:10px; left:10px; border-right:none; border-bottom:none; }
  .fc-tr{ top:10px; right:10px; border-left:none; border-bottom:none; }
  .fc-bl{ bottom:10px; left:10px; border-right:none; border-top:none; }
  .fc-br{ bottom:10px; right:10px; border-left:none; border-top:none; }

  .hud{
    position:absolute;
    left:12px; bottom:12px;
    font-family:var(--mono);
    font-size:11px;
    color:rgba(236,234,228,0.85);
    background:rgba(0,0,0,0.35);
    padding:4px 8px;
    border-radius:6px;
    backdrop-filter: blur(2px);
    letter-spacing:0.04em;
  }

  .placeholder{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; color:var(--text-dim);
    font-family:var(--mono); font-size:12px; text-align:center; padding:20px;
  }
  .placeholder button{
    margin-top:6px;
  }

  .flash{
    position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none;
  }
  .flash.go{ animation:flashfire 320ms ease-out; }
  @keyframes flashfire{
    0%{opacity:0.9;}
    100%{opacity:0;}
  }

  .controls{
    display:grid;
    grid-template-columns: 1fr auto 1fr;
    align-items:center;
    padding:4px 6px 2px;
  }

  .side-btn{
    justify-self:start;
    width:42px; height:42px;
    border-radius:50%;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .side-btn:last-of-type{ justify-self:end; }
  .side-btn svg{ width:18px; height:18px; }
  .side-btn:hover{ background:#2c2e32; }
  .side-btn:disabled{ opacity:0.35; cursor:not-allowed; }

  .shutter{
    justify-self:center;
    width:66px; height:66px;
    border-radius:50%;
    background:var(--accent);
    border:4px solid rgba(232,163,61,0.25);
    outline:2px solid var(--accent);
    outline-offset:4px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: transform 90ms ease;
  }
  .shutter:active{ transform:scale(0.92); }
  .shutter:disabled{
    background:var(--accent-dim);
    outline-color:var(--accent-dim);
    cursor:not-allowed;
  }

  .filmstrip{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:4px 2px 2px;
    min-height:64px;
  }
  .filmstrip::-webkit-scrollbar{ height:4px; }
  .filmstrip::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }

  .frame-thumb{
    position:relative;
    flex:0 0 auto;
    width:64px; height:48px;
    border-radius:6px;
    overflow:hidden;
    border:1px solid var(--line);
    cursor:pointer;
  }
  .frame-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .frame-thumb .dl{
    position:absolute; bottom:2px; right:2px;
    background:rgba(0,0,0,0.55);
    border-radius:4px;
    width:18px; height:18px;
    display:flex; align-items:center; justify-content:center;
  }
  .frame-thumb .dl svg{ width:10px; height:10px; color:#fff; }
  .frame-thumb .saved-badge{
    position:absolute; bottom:2px; right:2px;
    background:rgba(232,163,61,0.9);
    border-radius:4px;
    width:18px; height:18px;
    display:flex; align-items:center; justify-content:center;
  }
  .frame-thumb .saved-badge svg{ width:11px; height:11px; color:#1a1a1a; }

  .empty-strip{
    display:flex; align-items:center;
    font-family:var(--mono); font-size:11px; color:var(--text-dim);
    padding-left:4px; letter-spacing:0.04em;
  }

  .status{
    font-family:var(--mono); font-size:11px; color:var(--danger);
    text-align:center; min-height:14px;
  }
</style>
</head>
<body>

  <div class="rig">
    <div class="top-strip">
      <span class="brand">Aperture</span>
      <span class="rec-dot"><span class="d"></span>LIVE</span>
    </div>

    <div class="folder-row">
      <button id="folderBtn" class="folder-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
        <span id="folderLabel">Choose save folder</span>
      </button>
      <label class="autosave-toggle" id="autosaveWrap" style="display:none;">
        <input type="checkbox" id="autosaveCheck" checked>
        <span>Auto-save on capture</span>
      </label>
    </div>

    <div class="viewfinder" id="viewfinder">
      <video id="video" autoplay playsinline muted></video>
      <div class="frame-corners">
        <span class="fc-tl"></span><span class="fc-tr"></span>
        <span class="fc-bl"></span><span class="fc-br"></span>
      </div>
      <div class="hud" id="hud">— × —</div>
      <div class="flash" id="flash"></div>
      <div class="placeholder" id="placeholder">
        <span>Camera is off</span>
        <button class="side-btn" id="startBtn" style="width:auto;height:auto;padding:8px 14px;border-radius:8px;font-family:var(--mono);font-size:11px;">START CAMERA</button>
      </div>
    </div>

    <div class="controls">
      <button class="side-btn" id="switchBtn" title="Switch camera" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      </button>
      <button class="shutter" id="shutterBtn" title="Capture photo" disabled></button>
      <button class="side-btn" id="stopBtn" title="Stop camera" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
      </button>
    </div>

    <div class="status" id="status"></div>

    <div id="filmstripWrap">
      <div class="empty-strip" id="emptyStrip">No shots yet — captured photos appear here</div>
      <div class="filmstrip" id="filmstrip" style="display:none;"></div>
    </div>
  </div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const viewfinder = document.getElementById('viewfinder');
const placeholder = document.getElementById('placeholder');
const hud = document.getElementById('hud');
const flash = document.getElementById('flash');
const statusEl = document.getElementById('status');
const filmstrip = document.getElementById('filmstrip');
const emptyStrip = document.getElementById('emptyStrip');

const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const switchBtn = document.getElementById('switchBtn');
const shutterBtn = document.getElementById('shutterBtn');

let currentStream = null;
let facingMode = 'user'; // 'user' = front, 'environment' = rear
let shotCount = 0;

let dirHandle = null; // File System Access API directory handle, if granted
const supportsFSAccess = 'showDirectoryPicker' in window;

const folderBtn = document.getElementById('folderBtn');
const folderLabel = document.getElementById('folderLabel');
const autosaveWrap = document.getElementById('autosaveWrap');
const autosaveCheck = document.getElementById('autosaveCheck');

if(!supportsFSAccess){
  // Firefox / Safari: no folder access API, fall back to auto-download only
  folderLabel.textContent = 'Auto-download on capture';
  folderBtn.disabled = true;
  folderBtn.style.opacity = '0.6';
  folderBtn.style.cursor = 'default';
}

folderBtn.addEventListener('click', async () => {
  if(!supportsFSAccess) return;
  try{
    dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
    folderLabel.textContent = dirHandle.name;
    folderBtn.classList.add('linked');
    autosaveWrap.style.display = 'flex';
    setStatus('');
  }catch(err){
    // user cancelled the picker — not an error worth surfacing
    if(err.name !== 'AbortError'){
      console.error(err);
      setStatus('Could not access that folder: ' + err.message);
    }
  }
});

async function saveToFolder(dataUrl, filename){
  if(!dirHandle) return false;
  try{
    // verify/re-request permission in case it lapsed
    const perm = await dirHandle.queryPermission({ mode: 'readwrite' });
    if(perm !== 'granted'){
      const req = await dirHandle.requestPermission({ mode: 'readwrite' });
      if(req !== 'granted') return false;
    }
    const fileHandle = await dirHandle.getFileHandle(filename, { create: true });
    const writable = await fileHandle.createWritable();
    const blob = await (await fetch(dataUrl)).blob();
    await writable.write(blob);
    await writable.close();
    return true;
  }catch(err){
    console.error(err);
    setStatus('Save failed: ' + err.message);
    return false;
  }
}

function triggerDownload(dataUrl, filename){
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function setStatus(msg){
  statusEl.textContent = msg || '';
}

async function startCamera(mode){
  setStatus('');
  stopCamera(); // release any existing stream first

  try{
    const constraints = {
      video: { facingMode: mode, width:{ideal:1280}, height:{ideal:960} },
      audio: false
    };
    const stream = await navigator.mediaDevices.getUserMedia(constraints);
    currentStream = stream;
    video.srcObject = stream;
    facingMode = mode;

    viewfinder.classList.toggle('rear', mode === 'environment');
    placeholder.style.display = 'none';

    stopBtn.disabled = false;
    shutterBtn.disabled = false;
    switchBtn.disabled = false;

    video.onloadedmetadata = () => {
      hud.textContent = `${video.videoWidth} × ${video.videoHeight}`;
    };
  }catch(err){
    console.error(err);
    placeholder.style.display = 'flex';
    stopBtn.disabled = true;
    shutterBtn.disabled = true;
    switchBtn.disabled = true;
    if(err.name === 'NotAllowedError'){
      setStatus('Camera access denied. Allow permission and try again.');
    } else if(err.name === 'NotFoundError'){
      setStatus('No camera found on this device.');
    } else {
      setStatus('Could not start camera: ' + err.message);
    }
  }
}

function stopCamera(){
  if(currentStream){
    currentStream.getTracks().forEach(t => t.stop());
    currentStream = null;
  }
  video.srcObject = null;
}

function fullStop(){
  stopCamera();
  placeholder.style.display = 'flex';
  hud.textContent = '— × —';
  stopBtn.disabled = true;
  shutterBtn.disabled = true;
  switchBtn.disabled = true;
}

async function capturePhoto(){
  if(!currentStream) return;

  const w = video.videoWidth, h = video.videoHeight;
  if(!w || !h) return;

  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');

  // mirror the capture if front camera, to match what user sees
  if(facingMode === 'user'){
    ctx.translate(w, 0);
    ctx.scale(-1, 1);
  }
  ctx.drawImage(video, 0, 0, w, h);

  const dataUrl = canvas.toDataURL('image/png');

  flash.classList.remove('go');
  void flash.offsetWidth; // restart animation
  flash.classList.add('go');

  shotCount++;
  const filename = `photo-${String(shotCount).padStart(3,'0')}-${Date.now()}.png`;
  let savedTo = null;

  if(dirHandle && autosaveCheck.checked){
    const ok = await saveToFolder(dataUrl, filename);
    savedTo = ok ? dirHandle.name : null;
    if(!ok) setStatus('Could not save to folder — check it in the filmstrip instead.');
  } else if(!supportsFSAccess){
    // no folder API available at all: always auto-download
    triggerDownload(dataUrl, filename);
    savedTo = 'downloads';
  }

  addThumb(dataUrl, filename, savedTo);
}

function addThumb(dataUrl, filename, savedTo){
  emptyStrip.style.display = 'none';
  filmstrip.style.display = 'flex';

  const wrap = document.createElement('div');
  wrap.className = 'frame-thumb';

  const img = document.createElement('img');
  img.src = dataUrl;
  wrap.appendChild(img);

  if(savedTo){
    const badge = document.createElement('div');
    badge.className = 'saved-badge';
    badge.title = savedTo === 'downloads' ? 'Saved to Downloads' : `Saved to "${savedTo}"`;
    badge.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
    wrap.appendChild(badge);
  } else {
    // no auto-save happened — offer manual download from the thumbnail
    const dl = document.createElement('a');
    dl.className = 'dl';
    dl.href = dataUrl;
    dl.download = filename;
    dl.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
    wrap.appendChild(dl);
  }

  wrap.title = 'Click thumbnail to open full size';
  wrap.addEventListener('click', (e) => {
    if(e.target.closest('.dl')) return;
    window.open(dataUrl, '_blank');
  });

  filmstrip.prepend(wrap);
}

startBtn.addEventListener('click', () => startCamera(facingMode));
stopBtn.addEventListener('click', fullStop);
switchBtn.addEventListener('click', () => {
  const next = facingMode === 'user' ? 'environment' : 'user';
  startCamera(next);
});
shutterBtn.addEventListener('click', capturePhoto);

// keyboard: spacebar to capture
document.addEventListener('keydown', (e) => {
  if(e.code === 'Space' && !shutterBtn.disabled){
    e.preventDefault();
    capturePhoto();
  }
});
</script>
</body>
</html>
